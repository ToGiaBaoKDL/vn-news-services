[project]
name = "news-service-common"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.13",
  "confluent-kafka[json,schemaregistry]>=2.14.0",
  "httpx>=0.28.1",
  "news-platform-lib",
  "zstandard>=0.25.0",
]

[tool.uv.sources]
news-platform-lib = { path = "../../../vn-news-platform-lib", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_service_common"]
