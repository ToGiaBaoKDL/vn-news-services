[project]
name = "news-dlq-operator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "news-platform-lib",
  "news-service-common",
]

[tool.uv.sources]
news-platform-lib = { path = "../../../vn-news-platform-lib", editable = true }
news-service-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_dlq_operator"]
